name: Validate stable release tag

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.validate.outputs.tag }}
      publishing:
        value: ${{ jobs.validate.outputs.publishing }}

permissions:
  contents: read

jobs:
  validate:
    name: Require a stable vX.Y.Z tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      publishing: ${{ steps.validate.outputs.publishing }}
    steps:
      - id: validate
        name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          # Only these two modes may plan without validating a release tag.
          # Use the event, not a caller-selected ref, to identify pull requests.
          case "$RELEASE_EVENT" in
            pull_request)
              [[ -z "$RELEASE_TAG" ]] || exit 1
              printf 'tag=\npublishing=false\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            workflow_dispatch)
              if [[ "$RELEASE_TAG" == dry-run ]]; then
                printf 'tag=\npublishing=false\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *) printf 'unsupported release event: %s\n' "$RELEASE_EVENT" >&2; exit 1 ;;
          esac

          release_tag=$RELEASE_TAG
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tags must match vX.Y.Z; got %s\n' "$release_tag" >&2
            exit 1
          fi
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/$release_tag" ]]; then
            printf 'release tag %s does not match ref %s\n' "$release_tag" "$RELEASE_REF" >&2
            exit 1
          fi

          tag_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$release_tag" \
            --jq '.sha')
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'release tag %s points to %s, but the workflow is building %s\n' \
              "$release_tag" "$tag_commit" "$RELEASE_COMMIT" >&2
            exit 1
          fi
          # Only validated single-line data reaches downstream jobs.
          printf 'tag=%s\npublishing=true\n' "$release_tag" >> "$GITHUB_OUTPUT"
