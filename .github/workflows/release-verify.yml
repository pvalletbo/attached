name: Verify release archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-archive-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify ${{ matrix.target }} release archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.32.0 --locked
      - name: Validate distribution manifest
        run: >-
          dist manifest --artifacts=local --output-format=json --no-local-paths
          > dist-manifest.json
      - name: Build non-publishing release archive
        run: >-
          dist build --artifacts=local --target ${{ matrix.target }}
          --output-format=json --no-local-paths > dist-build-manifest.json
      - name: Verify archive contents and executable
        shell: bash
        run: |
          archive="target/distrib/attached-${{ matrix.target }}.tar.xz"
          scripts/verify-release-archive.sh "$archive" "${{ matrix.target }}"

# This workflow deliberately has no tag trigger, release upload, artifact upload,
# package publication, or Homebrew tap credential. It verifies locally generated
# macOS archives only; a later, explicitly approved public-release PR owns publish
# permissions and any Homebrew tap integration.
