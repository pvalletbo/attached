name: Release candidate E2E

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  local-backend:
    name: Candidate SSH against disposable local Worker
    # cargo-dist invokes this after artifact builds, before hosting/publication.
    # Ordinary PR plans and dry-runs must not run the expensive integration test.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.tag != '' && github.event.inputs.tag != 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Download this run's Linux release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: candidate
      - name: Verify account creation, publication, and SSH before publishing
        # No --release (not published yet) or --service (never production).
        # The runner verifies the adjacent cargo-dist checksum before installation.
        run: cargo run --locked --package attached-e2e -- --archive candidate/attached-x86_64-unknown-linux-gnu.tar.xz
