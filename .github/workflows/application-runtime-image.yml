name: Build application runtime image

on:
  push:
    branches: [main]
    paths:
      - images/application-runtime/**
      - .github/workflows/application-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: herdr-sessions-k3s-dind
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/application-runtime
          file: images/application-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pvalletbo/attached-application-runtime:attached-0.2.9-herdr-0.8.2
            ghcr.io/pvalletbo/attached-application-runtime:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
