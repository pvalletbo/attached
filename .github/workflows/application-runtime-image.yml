name: Build application runtime image

on:
  push:
    branches: [main]
    paths:
      - images/application-runtime/**
      - .github/workflows/application-runtime-image.yml
  pull_request:
    paths:
      - images/application-runtime/**
      - .github/workflows/application-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 images/application-runtime/test_start_service.py
      - name: Build runtime and verify restricted-container supervision
        run: |
          docker build --tag attached-publisher:test images/application-runtime
          docker run --rm --read-only --user 101:101 \
            --tmpfs /tmp:rw,nosuid,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /usr/bin/python3 \
            --volume "$PWD/images/application-runtime:/tests:ro" \
            attached-publisher:test /tests/test_start_service.py

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/application-runtime
          file: images/application-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pvalletbo/attached-application-runtime:attached-0.2.9-herdr-0.8.2-publisher-v1
            ghcr.io/pvalletbo/attached-application-runtime:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
