name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - dev
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml
      - crates/session-sync-protocol/**
      - crates/session-sync-worker/**
      - crates/tunnel-protocol/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://herdr.attached.sh' || 'https://herdr.dev.attached.sh' }}
    defaults:
      run:
        working-directory: crates/session-sync-worker
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cloudflare-worker
          cache-on-failure: true
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable the pinned pnpm version
        run: corepack enable
      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile
      - name: Run local Worker integration tests
        run: pnpm run test:integration
      - name: Deploy development Worker
        if: github.ref == 'refs/heads/dev'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy:dev
      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy
