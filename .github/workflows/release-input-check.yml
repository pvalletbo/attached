name: Release input boundary

on:
  pull_request:
    paths:
      - .github/workflows/release*.yml
      - dist-workspace.toml
      - scripts/test_release_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/release*.yml
      - dist-workspace.toml
      - scripts/test_release_workflow.py

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check maintained release workflow boundaries without release operations
        run: python3 scripts/test_release_workflow.py
