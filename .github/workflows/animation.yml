name: Animation

on:
  pull_request:
    paths:
      - animation/**
      - .github/workflows/animation.yml
  push:
    branches: [main]
    paths:
      - animation/**
      - .github/workflows/animation.yml

permissions:
  contents: read

concurrency:
  group: animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: animation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animation/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Render the zine cut for human review
        run: npm run render -- --style zine
      - name: Save frame previews and videos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animation-preview
          path: |
            animation/test-results/**/*.png
            animation/output/*.mp4
          if-no-files-found: warn
          retention-days: 14
