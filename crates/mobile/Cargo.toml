[package]
name = "attached-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Embeddable Attached consumer transport with Swift bindings"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "attached-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
anyhow.workspace = true
attached-session-sync-protocol = { workspace = true, features = ["host-access"] }
attached-tunnel-protocol.workspace = true
chrono = { workspace = true, features = ["clock"] }
futures-util.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde_json.workspace = true
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519"] }
tokio.workspace = true
tokio-util.workspace = true
uniffi = "=0.31.0"
zeroize.workspace = true

# UniFFI generates the unsafe C ABI. All handwritten transport code is safe Rust.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile.workspace = true
