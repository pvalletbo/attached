[package]
name = "attached"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description.workspace = true

[lints]
workspace = true

# The CLI is distributed as release artifacts even though crates.io publishing is disabled.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
argon2.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
clap_complete.workspace = true
fs4.workspace = true
futures-util.workspace = true
attached-session-sync-protocol = { workspace = true, features = ["session-access"] }
attached-tunnel-protocol.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-flame.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
