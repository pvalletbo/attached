name = "attached-session-sync"
main = "build/index.js"
compatibility_date = "2026-08-18"
workers_dev = false
preview_urls = false
send_metrics = false
routes = [
  { pattern = "herdr.attached.sh", zone_name = "attached.sh", custom_domain = true },
]

# Anonymous account creation: 5 attempts/minute per IPv4 address or IPv6 /64.
# These are approximate, per-Cloudflare-location counters, not a global quota.
# Reserve distinct namespace IDs for production and development in this account.
[[ratelimits]]
name = "ACCOUNT_CREATION_RATE_LIMITER"
namespace_id = "2026091901"
simple = { limit = 5, period = 60 }

[build]
command = "worker-build --release"

[durable_objects]
bindings = [
  { name = "ACCOUNTS", class_name = "AccountObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountObject"]

[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
invocation_logs = false

[env.dev]
name = "attached-session-sync-dev"
routes = [
  { pattern = "herdr.dev.attached.sh", zone_name = "attached.sh", custom_domain = true },
]

[[env.dev.ratelimits]]
name = "ACCOUNT_CREATION_RATE_LIMITER"
namespace_id = "2026091902"
simple = { limit = 5, period = 60 }

# Bindings (including ratelimits) are not inherited by named environments.
# The top-level migration list is inherited and applies independently to this Worker.
[env.dev.durable_objects]
bindings = [
  { name = "ACCOUNTS", class_name = "AccountObject" },
]
