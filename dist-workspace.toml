[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Pin the dist version used to generate and run release CI.
cargo-dist-version = "0.32.0"
# Only distribute the user-facing CLI from this multi-package workspace.
packages = ["attached"]
# Build only the selected CLI package rather than every workspace member.
precise-builds = true
# Reuse dependency build artifacts between releases.
cache-builds = true
# Use cargo-dist's GitHub artifact plan, with a maintained release.yml input boundary.
ci = "github"
# cargo-dist 0.32 interpolates dispatch tags into shell source and runs plan-jobs
# concurrently with privileged planning. Preserve our validation dependency and
# environment/argv handling: ordinary `dist generate` skips CI; explicit CI
# generation is refused. scripts/test_release_workflow.py guards this customization.
# Revisit this CI-only opt-out when upgrading cargo-dist; other checks stay enabled.
allow-dirty = ["ci"]
# Release tags created by the cut-release workflow use GITHUB_TOKEN, so launch
# cargo-dist through an explicit workflow dispatch instead of a tag-push event.
dispatch-releases = true
hosting = "github"
# Build a curl-compatible shell installer.
installers = ["shell"]
# Use the conventional per-user executable directory without a toolchain-specific layout or
# elevated permissions. The installer adds this directory to PATH when necessary.
install-path = "~/.local/bin"
install-success-msg = "Attached is installed. Run attached --help to get started, or attached uninstall to remove it."
install-updater = false
# Native runners avoid cross-compilation for all supported platforms.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Validate the release plan on pull requests without building or publishing artifacts.
pr-run-mode = "plan"
# release.yml additionally requires this check BEFORE its built-in plan job.
plan-jobs = ["./release-tag-check"]
# Generate checksums and attest every artifact before creating the GitHub Release.
checksum = "sha256"
github-attestations = true
github-attestations-phase = "host"

# Pin generated workflow actions to reviewed commits.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"swatinem/rust-cache" = "e18b497796c12c097a38f9edb9d0641fb99eee32" # v2
